<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spin the Wheel</title>
<style>
:root{--bg:#fff8e7;--fg:#2a2118;--card:#ffffff;--line:#e8dcc0;--accent:#f5a300;--accent-fg:#2a2118;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14110c;--fg:#f6ecd6;--card:#1f1a12;--line:#3a3022;--accent:#f5a300;--accent-fg:#14110c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14110c;--fg:#f6ecd6;--card:#1f1a12;--line:#3a3022;--accent:#f5a300;--accent-fg:#14110c;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.app{max-width:1000px;margin:0 auto;padding:16px;display:grid;gap:16px;grid-template-columns:1fr}
@media(min-width:800px){.app{grid-template-columns:300px 1fr;align-items:start}.app.hide{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.app.hide .panel{display:none}
h1{font-size:20px;margin:0 0 8px}
textarea{width:100%;height:220px;resize:vertical;border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;background:var(--bg);color:var(--fg)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
button{font:inherit;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:10px;padding:9px 14px;cursor:pointer}
button.main{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:700}
label{display:flex;gap:8px;align-items:center;margin-top:10px;font-size:14px}
.count{font-size:13px;opacity:.7;margin-top:6px}
.stage{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px}
.logo{width:clamp(90px,22vw,140px);aspect-ratio:1;border-radius:18px;object-fit:cover;display:block;box-shadow:0 4px 16px rgba(0,0,0,.3)}
.wrap{position:relative;width:min(92vw,620px);aspect-ratio:1}
canvas#wheel{width:100%;height:100%;display:block}
.pointer{position:absolute;left:50%;top:-4px;transform:translateX(-50%);width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;border-top:34px solid var(--fg);filter:drop-shadow(0 2px 2px rgba(0,0,0,.35));z-index:2}
#spin{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:22%;aspect-ratio:1;border-radius:50%;font-size:clamp(14px,3.4vw,24px);font-weight:800;letter-spacing:1px;background:var(--accent);color:var(--accent-fg);border:5px solid var(--card);box-shadow:0 4px 14px rgba(0,0,0,.35);padding:0;z-index:2}
#spin:disabled{opacity:.7;cursor:default}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:40;padding:20px}
.modal.show{display:flex}
.box{background:var(--card);border-radius:22px;padding:28px 24px;text-align:center;max-width:520px;width:100%;border:3px solid var(--accent);animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
.box small{letter-spacing:3px;text-transform:uppercase;opacity:.7}
.box h2{font-size:clamp(32px,9vw,60px);margin:10px 0 18px;word-break:break-word;line-height:1.05}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.toggle{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));font-size:13px;opacity:.8;z-index:5}
</style>
</head>
<body>

  <section class="panel">
    <h1>Participants</h1>
    <textarea id="names" placeholder="One name per line"></textarea>
    <div class="count" id="count"></div>
    <div class="row">
      <button id="shuffle">Shuffle</button>
      <button id="clear">Clear</button>
    </div>
    <label><input type="checkbox" id="remove"> Remove winner after each spin</label>
  </section>

    <div class="wrap">
      <div class="pointer"></div>
      <canvas id="wheel"></canvas>
      <button id="spin">SPIN</button>
    </div>
  </section>
</div>
<button class="toggle" id="toggle">Hide panel</button>
<div class="modal" id="modal">
  <div class="box">
    <small>The winner is</small>
    <h2 id="winner"></h2>
    <div class="row" style="justify-content:center">
      <button class="main" id="again">Spin again</button>
      <button id="rm">Remove winner</button>
    </div>
  </div>
</div>
<canvas id="fx"></canvas>
<script>
(function(){
var PI2=Math.PI*2, names=[], angle=0, spinning=false, lastWinner=-1;
var $=function(id){return document.getElementById(id)};
var cv=$('wheel'), ctx=cv.getContext('2d'), ta=$('names');
var pal=['#f5a300','#e4572e','#2e86ab','#76b041','#a23b72','#f18f01','#17bebb','#6c4ab6','#d1495b','#3d9970'];
try{var saved=localStorage.getItem('wheel-names');if(saved)ta.value=saved}catch(e){}
if(!ta.value)ta.value='Aisha\nBilal\nCharlie\nDiya\nEthan\nFatima';

function parse(){
  names=ta.value.split('\n').map(function(s){return s.trim()}).filter(Boolean);
  $('count').textContent=names.length+' participant'+(names.length===1?'':'s');
  try{localStorage.setItem('wheel-names',ta.value)}catch(e){}
}
function size(){
  var r=cv.getBoundingClientRect(),d=window.devicePixelRatio||1;
  cv.width=r.width*d;cv.height=r.height*d;draw();
}
function draw(){
  var w=cv.width,c=w/2,R=c-6*(window.devicePixelRatio||1);
  ctx.clearRect(0,0,w,w);
  var n=names.length;
  if(!n){
    ctx.fillStyle=pal[0];ctx.beginPath();ctx.arc(c,c,R,0,PI2);ctx.fill();
    ctx.fillStyle='#2a2118';ctx.font='bold '+w/20+'px system-ui';ctx.textAlign='center';
    ctx.fillText('Add names',c,c+w/60);return;
  }
  var seg=PI2/n;
  for(var i=0;i<n;i++){
    var a=angle+i*seg;
    ctx.beginPath();ctx.moveTo(c,c);ctx.arc(c,c,R,a,a+seg);ctx.closePath();
    ctx.fillStyle=pal[i%pal.length];ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.7)';ctx.lineWidth=2;ctx.stroke();
    ctx.save();ctx.translate(c,c);ctx.rotate(a+seg/2);
    ctx.fillStyle='#fff';ctx.textAlign='right';ctx.textBaseline='middle';
    var fs=Math.max(w/60,Math.min(w/20,R*seg*0.45,w/26));
    ctx.font='bold '+fs+'px system-ui';
    ctx.shadowColor='rgba(0,0,0,.45)';ctx.shadowBlur=3;
    var t=names[i],max=R*0.62;
    while(ctx.measureText(t).width>max&&t.length>2)t=t.slice(0,-1);
    if(t!==names[i])t=t.trim()+'…';
    ctx.fillText(t,R-w/32,0);ctx.restore();
  }
}
function ease(t){return 1-Math.pow(1-t,4)}
function spin(){
  if(spinning||names.length<2)return;
  spinning=true;$('spin').disabled=true;
  var start=angle,total=PI2*(6+Math.random()*4)+Math.random()*PI2,dur=6500,t0=performance.now();
  (function frame(now){
    var p=Math.min(1,(now-t0)/dur);
    angle=start+total*ease(p);draw();
    if(p<1)requestAnimationFrame(frame);else finish();
  })(t0);
}
function finish(){
  spinning=false;$('spin').disabled=false;
  var n=names.length,seg=PI2/n;
  var rel=((-Math.PI/2-angle)%PI2+PI2)%PI2;
  lastWinner=Math.floor(rel/seg)%n;
  $('winner').textContent=names[lastWinner];
  $('modal').classList.add('show');
  confetti();
}
function removeWinner(){
  if(lastWinner<0)return;
  names.splice(lastWinner,1);ta.value=names.join('\n');lastWinner=-1;parse();draw();
}
$('again').onclick=function(){
  $('modal').classList.remove('show');
  if($('remove').checked)removeWinner();
};
$('rm').onclick=function(){removeWinner();$('modal').classList.remove('show')};
$('shuffle').onclick=function(){
  parse();
  for(var i=names.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=names[i];names[i]=names[j];names[j]=t}
  ta.value=names.join('\n');parse();draw();
};
$('clear').onclick=function(){ta.value='';parse();draw()};
ta.oninput=function(){parse();draw()};
$('spin').onclick=spin;
$('toggle').onclick=function(){
  var h=$('app').classList.toggle('hide');
  $('toggle').textContent=h?'Show panel':'Hide panel';
  setTimeout(size,30);
};
window.addEventListener('resize',size);

/* confetti */
var fx=$('fx'),fc=fx.getContext('2d'),parts=[],running=false;
function fxSize(){fx.width=innerWidth;fx.height=innerHeight}
fxSize();window.addEventListener('resize',fxSize);
function burst(x,y,n){
  for(var i=0;i<n;i++){
    var a=Math.random()*PI2,s=6+Math.random()*12;
    parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-6,r:Math.random()*PI2,vr:(Math.random()-.5)*.4,
      w:6+Math.random()*8,h:4+Math.random()*6,c:pal[Math.floor(Math.random()*pal.length)],life:0});
  }
}
function confetti(){
  var W=fx.width,H=fx.height;
  burst(W/2,H/2,160);
  setTimeout(function(){burst(W*.2,H*.6,90);burst(W*.8,H*.6,90)},350);
  setTimeout(function(){burst(W/2,H*.35,120)},800);
  if(!running){running=true;requestAnimationFrame(tick)}
}
function tick(){
  fc.clearRect(0,0,fx.width,fx.height);
  parts=parts.filter(function(p){return p.y<fx.height+30&&p.life<260});
  parts.forEach(function(p){
    p.vy+=.28;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.life++;
    fc.save();fc.translate(p.x,p.y);fc.rotate(p.r);fc.fillStyle=p.c;
    fc.fillRect(-p.w/2,-p.h/2,p.w,p.h);fc.restore();
  });
  if(parts.length)requestAnimationFrame(tick);else running=false;
}
parse();size();
})();
</script>
</body>
